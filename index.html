<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f5f7">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>豊中JC 人脈グラフ</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  /* ── トークン: 出欠アプリ(/shukketsu/)・ホーム(/)と同じ値。書体は端末標準、色は無彩色＋#0071e3。
     グラフのノード色だけは「委員会などの識別」のために8色（dataviz検証済み・ライト面）を使う。 */
  :root {
    --bg: #f5f5f7; --surface: #ffffff; --text: #1d1d1f; --sub: #6e6e73; --hint: #86868b;
    --line: #d2d2d7; --line-soft: #e8e8ed; --fill: #f2f2f4;
    --accent: #0071e3; --accent-press: #006edb; --accent-soft: #e8f1fd;
    --r-pill: 980px; --r-block: 10px; --r-card: 14px;
    --ease: cubic-bezier(.4, 0, .6, 1);
    --font: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic Medium", sans-serif;
    --top-h: 56px; --panel-w: 272px; --detail-w: 340px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; font-family: var(--font); font-size: 14px; line-height: 1.5; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; font-feature-settings: "palt"; overflow: hidden; }
  a { color: var(--accent); text-decoration: none; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }
  .num { font-variant-numeric: tabular-nums; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0s !important; transition-duration: 0s !important; } }

  /* ── トップバー ── */
  #top { position: fixed; top: 0; left: 0; right: 0; height: var(--top-h); z-index: 20; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line-soft); }
  #top .brand { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  #top .brand a { font-size: 11px; color: var(--sub); letter-spacing: .04em; }
  #top .brand h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
  #top .brand h1 span { font-size: 12px; font-weight: 600; color: var(--sub); margin-left: 6px; letter-spacing: 0; }
  #search { flex: 1; max-width: 360px; position: relative; }
  #search input { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: var(--r-pill); padding: 0 14px; background: var(--fill); }
  #search input:focus { background: var(--surface); border-color: var(--accent); outline: none; }
  #sugg { position: absolute; top: 40px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-block); overflow: hidden; display: none; max-height: 280px; overflow-y: auto; }
  #sugg div { padding: 9px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  #sugg div:hover, #sugg div.on { background: var(--fill); }
  #sugg small { color: var(--sub); }
  .seg { display: inline-flex; background: var(--fill); border-radius: var(--r-pill); padding: 3px; }
  .seg button { height: 30px; padding: 0 14px; border-radius: var(--r-pill); font-size: 13px; color: var(--sub); }
  .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: 0 0 0 1px var(--line-soft); }
  .btn { height: 36px; padding: 0 14px; border-radius: var(--r-pill); font-size: 13px; font-weight: 600; background: var(--fill); color: var(--text); white-space: nowrap; }
  .btn.primary { background: var(--accent); color: #fff; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: default; }
  #top .spacer { flex: 1; }

  /* ── グラフ ── */
  #graph { position: fixed; inset: var(--top-h) 0 0 0; width: 100%; height: calc(100% - var(--top-h)); background: var(--bg); touch-action: none; }
  .link { fill: none; stroke: #b8b8bf; stroke-width: 1.4; transition: opacity .2s var(--ease); }
  .link.intro { stroke: #6e6e73; }
  .link.cl { stroke: #6e6e73; stroke-dasharray: 5 4; }
  .link.hobby { stroke: #1baf7a; stroke-dasharray: 1.5 4; stroke-linecap: round; }
  .link.committee, .link.industry { stroke: #d2d2d7; stroke-width: 1; }
  .link.other { stroke: #eb6834; }
  .link.path { stroke: var(--accent); stroke-width: 3; stroke-dasharray: none; }
  .link.faded { opacity: .06; }
  .node { cursor: pointer; }
  .node circle { stroke: #fff; stroke-width: 2; transition: opacity .2s var(--ease); }
  .node.ghost circle { fill: #fff; stroke: #9a9aa2; stroke-dasharray: 3 3; stroke-width: 1.5; }
  .node.ghost text { fill: var(--sub); }
  .node text { font-size: 11px; fill: var(--text); pointer-events: none; text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; stroke-linejoin: round; font-weight: 500; transition: opacity .2s var(--ease); }
  .node.selected circle { stroke: var(--accent); stroke-width: 3; }
  .node.path circle { stroke: var(--accent); stroke-width: 3; }
  .node.faded { opacity: .14; }
  .node.me circle { stroke: var(--text); }
  marker path { fill: #6e6e73; }
  marker.path path { fill: var(--accent); }

  /* ── 設定パネル（Obsidianの右パネルの型。ライト面） ── */
  #panel { position: fixed; top: calc(var(--top-h) + 12px); left: 12px; width: var(--panel-w); max-height: calc(100% - var(--top-h) - 24px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-card); z-index: 15; padding: 6px 0 10px; }
  #panel.hidden { display: none; }
  .sec { padding: 10px 16px 6px; }
  .sec + .sec { border-top: 1px solid var(--line-soft); }
  .sec h2 { margin: 0 0 8px; font-size: 12px; font-weight: 600; color: var(--sub); letter-spacing: .02em; display: flex; justify-content: space-between; align-items: baseline; }
  .sec h2 small { font-weight: 500; color: var(--hint); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 28px; padding: 0 11px; border-radius: var(--r-pill); font-size: 12px; background: var(--fill); color: var(--sub); display: inline-flex; align-items: center; gap: 6px; }
  .chip.on { background: var(--text); color: #fff; }
  .chip .sw { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .chip .sw.dash { background: none; width: 12px; height: 0; border-top: 2px dashed currentColor; border-radius: 0; }
  .chip .sw.dot { background: none; width: 12px; height: 0; border-top: 2px dotted currentColor; border-radius: 0; }
  .chip .sw.line { background: none; width: 12px; height: 0; border-top: 2px solid currentColor; border-radius: 0; }
  .legend { display: flex; flex-direction: column; gap: 4px; }
  .legend button { display: flex; align-items: center; gap: 8px; font-size: 12px; padding: 3px 0; text-align: left; color: var(--text); }
  .legend button.off { color: var(--hint); }
  .legend button.off .sw { opacity: .25; }
  .legend .sw { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .legend .n { margin-left: auto; color: var(--hint); font-size: 11px; }
  .range { display: grid; grid-template-columns: 56px 1fr 34px; align-items: center; gap: 8px; font-size: 12px; color: var(--sub); padding: 2px 0; }
  .range input { width: 100%; accent-color: var(--accent); }
  .range .v { text-align: right; color: var(--text); }
  .row2 { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .row2 label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  .row2 input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; }
  .tl { display: flex; align-items: center; gap: 8px; }
  .tl .year { font-size: 20px; font-weight: 700; min-width: 54px; letter-spacing: -.01em; }
  .tl input { flex: 1; accent-color: var(--accent); }
  .tl .play { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; }
  .tl .play.on { background: var(--text); }
  .focus-box { display: flex; align-items: center; gap: 8px; background: var(--accent-soft); border-radius: var(--r-block); padding: 8px 10px; font-size: 13px; }
  .focus-box b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .focus-box button { color: var(--accent); font-size: 12px; font-weight: 600; }

  /* ── 詳細パネル ── */
  #detail { position: fixed; top: calc(var(--top-h) + 12px); right: 12px; width: var(--detail-w); max-height: calc(100% - var(--top-h) - 24px); overflow-y: auto; background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-card); z-index: 16; display: none; }
  #detail.open { display: block; }
  .d-head { padding: 16px 18px 10px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--surface); }
  .d-head .eyebrow { font-size: 12px; color: var(--sub); display: flex; align-items: center; gap: 6px; }
  .d-head .eyebrow .sw { width: 9px; height: 9px; border-radius: 50%; }
  .d-head h3 { margin: 2px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.015em; line-height: 1.2; }
  .d-head .close { position: absolute; top: 12px; right: 12px; width: 30px; height: 30px; border-radius: 50%; background: var(--fill); color: var(--sub); font-size: 16px; line-height: 30px; text-align: center; }
  .d-body { padding: 6px 18px 16px; }
  .kv { display: grid; grid-template-columns: 64px 1fr; gap: 4px 10px; font-size: 13px; padding: 8px 0; }
  .kv dt { color: var(--sub); } .kv dd { margin: 0; }
  .d-sec { padding: 10px 0 4px; border-top: 1px solid var(--line-soft); }
  .d-sec h4 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--sub); }
  .d-sec .empty { font-size: 12px; color: var(--hint); }
  .people { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { height: 28px; padding: 0 11px; border-radius: var(--r-pill); font-size: 12px; background: var(--fill); display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
  .pill .sw { width: 8px; height: 8px; border-radius: 50%; }
  .pill.ghost { border: 1px dashed var(--line); background: transparent; color: var(--sub); }
  .pill small { color: var(--hint); }
  .chain { font-size: 13px; line-height: 1.8; }
  .chain .arrow { color: var(--hint); margin: 0 6px; }
  .chain button { color: var(--accent); font-weight: 500; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 0 4px; }
  .path-hint { background: var(--accent-soft); border-radius: var(--r-block); padding: 8px 10px; font-size: 12px; margin-top: 8px; }

  /* ── ステータス・トースト・ロード・ゲート ── */
  #status { position: fixed; left: 12px; bottom: 10px; z-index: 14; font-size: 11px; color: var(--sub); background: rgba(255,255,255,.85); padding: 4px 10px; border-radius: var(--r-pill); display: flex; gap: 12px; }
  #status b { color: var(--text); font-weight: 600; }
  #toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); z-index: 30; background: var(--text); color: #fff; padding: 10px 16px; border-radius: var(--r-block); font-size: 13px; max-width: min(92vw, 520px); display: none; }
  #loading { position: fixed; inset: var(--top-h) 0 0 0; z-index: 12; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: var(--sub); background: var(--bg); }
  #loading.hide { display: none; }
  .spin { width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: sp .8s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  #gate { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: none; padding: 0 20px; }
  #gate.open { display: block; }
  #gate .wrap { max-width: 420px; margin: 0 auto; padding-top: 22px; }
  #gate .eyebrow { font-size: 12px; color: var(--sub); }
  #gate h1 { font-size: 30px; margin: 4px 0 0; letter-spacing: -.02em; }
  #gate .card { background: var(--surface); border-radius: var(--r-card); padding: 18px; margin-top: 18px; }
  #gate p { margin: 0 0 12px; font-size: 14px; color: var(--sub); }
  #gate input { width: 100%; height: 46px; border: 1px solid var(--line); border-radius: var(--r-block); padding: 0 14px; font-size: 16px; background: var(--surface); }
  #gate .err { color: #c93c3c; font-size: 13px; min-height: 20px; margin-top: 8px; }
  #gate .btn { width: 100%; height: 46px; margin-top: 6px; font-size: 15px; }
  #err { position: fixed; inset: var(--top-h) 0 0 0; z-index: 13; display: none; align-items: center; justify-content: center; padding: 20px; }
  #err.open { display: flex; }
  #err .card { background: var(--surface); border-radius: var(--r-card); padding: 20px; max-width: 420px; }
  #err h3 { margin: 0 0 6px; font-size: 16px; }
  #err p { margin: 0 0 12px; font-size: 13px; color: var(--sub); }

  /* ── モバイル ── */
  #menu-btn { display: none; }
  @media (max-width: 760px) {
    :root { --top-h: 52px; }
    #top { gap: 8px; padding: 0 12px; }
    #top .brand h1 { font-size: 15px; } #top .brand a { display: none; }
    #search { max-width: none; min-width: 0; flex: 1 1 120px; }
    #search input { height: 34px; padding: 0 12px; }
    .seg-top, #btn-fit, #top .spacer { display: none; }
    #menu-btn { display: inline-flex; align-items: center; flex-shrink: 0; }
    #fit-sp { display: inline-flex; }
    #panel { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 62vh; border-radius: var(--r-card) var(--r-card) 0 0; border-bottom: 0; padding-bottom: env(safe-area-inset-bottom); }
    #detail { left: 0; right: 0; top: auto; bottom: 0; width: auto; max-height: 70vh; border-radius: var(--r-card) var(--r-card) 0 0; border-bottom: 0; }
    #status { display: none; }
    .node text { font-size: 12px; }
  }
</style>
</head>
<body>

<header id="top">
  <div class="brand"><a href="/">豊中青年会議所</a><h1>人脈グラフ<span id="year-label"></span></h1></div>
  <div id="search"><input id="q" type="search" placeholder="名前で探す" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="名前で探す"><div id="sugg" role="listbox"></div></div>
  <div class="seg seg-top" role="group" aria-label="表示範囲"><button id="m-global" class="on">全体</button><button id="m-local">まわり</button></div>
  <span class="spacer"></span>
  <button class="btn" id="btn-fit">全体を表示</button>
  <button class="btn" id="menu-btn">設定</button>
</header>

<svg id="graph" aria-label="人脈グラフ"></svg>

<aside id="panel" aria-label="表示の設定">
  <div class="sec" id="sec-focus" style="display:none">
    <h2>起点</h2>
    <div class="focus-box"><b id="focus-name"></b><button id="focus-clear">全体に戻す</button></div>
    <div class="range" style="margin-top:8px"><span>深さ</span><input id="depth" type="range" min="1" max="3" step="1" value="1"><span class="v num" id="depth-v">1</span></div>
  </div>
  <div class="sec">
    <h2>色分け</h2>
    <div class="chips" id="colorby">
      <button class="chip on" data-v="committee">委員会</button>
      <button class="chip" data-v="industry">業種</button>
      <button class="chip" data-v="jc">JC歴</button>
      <button class="chip" data-v="join">入会年</button>
    </div>
    <div class="legend" id="legend" style="margin-top:10px"></div>
  </div>
  <div class="sec">
    <h2>つながり <small>押して表示／非表示</small></h2>
    <div class="chips" id="edges">
      <button class="chip on" data-v="intro"><span class="sw line"></span>紹介</button>
      <button class="chip on" data-v="cl"><span class="sw dash"></span>クロージング</button>
      <button class="chip on" data-v="hobby"><span class="sw dot"></span>趣味</button>
      <button class="chip" data-v="committee"><span class="sw line"></span>同じ委員会</button>
      <button class="chip" data-v="industry"><span class="sw line"></span>同じ業種</button>
    </div>
    <div class="row2" style="margin-top:8px"><label><input type="checkbox" id="show-ob" checked>OB・紹介者（名簿外）を出す</label></div>
    <div class="row2"><label><input type="checkbox" id="hide-orphan">つながりの無い人を隠す</label></div>
    <div class="row2"><label><input type="checkbox" id="labels-all">名前を常に出す</label></div>
  </div>
  <div class="sec">
    <h2>入会年でたどる <small id="tl-hint">再生すると年ごとに人が増える</small></h2>
    <div class="tl"><button class="play" id="tl-play" aria-label="再生">再生</button><span class="year num" id="tl-year">—</span><input id="tl" type="range" min="0" max="0" step="1" value="0"></div>
  </div>
  <div class="sec">
    <h2>ちらばり方</h2>
    <div class="range"><span>反発</span><input id="f-repel" type="range" min="40" max="600" step="10" value="240"><span class="v num" id="f-repel-v">240</span></div>
    <div class="range"><span>線の長さ</span><input id="f-dist" type="range" min="30" max="200" step="5" value="70"><span class="v num" id="f-dist-v">70</span></div>
    <div class="range"><span>中心へ</span><input id="f-center" type="range" min="0" max="20" step="1" value="5"><span class="v num" id="f-center-v">5</span></div>
  </div>
  <div class="sec" id="sec-admin" style="display:none">
    <h2>役員</h2>
    <div class="row2"><a id="db-link" href="#" target="_blank" rel="noopener">DBスプレッドシートを開く（属性・関係の入力）</a></div>
    <div class="row2 hint" id="missing"></div>
  </div>
  <div class="sec"><div class="row2" style="justify-content:space-between"><span class="hint" id="updated"></span><span><button class="btn ghost" id="fit-sp" style="height:28px;padding:0 8px;font-size:12px;display:none">全体を表示</button><button class="btn ghost" id="btn-reload" style="height:28px;padding:0 8px;font-size:12px">最新に更新</button></span></div></div>
</aside>

<aside id="detail" aria-live="polite"></aside>

<div id="status"><span>メンバー <b id="st-m" class="num">0</b></span><span>OB等 <b id="st-g" class="num">0</b></span><span>表示中 <b id="st-v" class="num">0</b></span><span>つながり <b id="st-e" class="num">0</b></span></div>
<div id="loading"><div class="spin"></div><div>名簿と関係を読み込んでいます</div></div>
<div id="err"><div class="card"><h3 id="err-t">読み込めませんでした</h3><p id="err-m"></p><button class="btn primary" id="err-retry">もう一度</button></div></div>
<div id="toast" role="status"></div>

<div id="gate">
  <div class="wrap">
    <div class="eyebrow">豊中青年会議所</div>
    <h1>人脈グラフ</h1>
    <div class="card">
      <p>出欠アプリと同じ合言葉を入れてください。この端末に記憶されるので、次回からは不要です。</p>
      <input id="pass" type="text" inputmode="latin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="合言葉">
      <div class="err" id="gate-err"></div>
      <button class="btn primary" id="gate-go">開く</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── 端末の記憶（出欠アプリと同じキー。同一オリジンなので出欠で入れた合言葉がそのまま使える）
  var K_PASS = 'tjc.pass', K_ME = 'tjc.me', K_CACHE = 'tjc.graph.cache';
  var store = {
    get: function (k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
    del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
  };

  // ── サーバー呼び出し（出欠アプリと同じ型）
  var API_URL = 'https://script.google.com/macros/s/XXXXXXXX/exec'; // ← GAS「豊中JC人脈グラフ」の /exec に差し替える
  var HAS_GAS = typeof google !== 'undefined' && google.script && google.script.run;
  var USE_API = !HAS_GAS && !window.MOCK && /^https?:\/\/script\.google\.com\/macros\/s\/AKfy/.test(API_URL);
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (HAS_GAS) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(new Error(e && e.message || String(e))); });
        r[fn].apply(r, args);
      } else if (USE_API) {
        fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, credentials: 'omit', redirect: 'follow' })
          .then(function (res) { return res.json(); })
          .then(function (j) { if (j && j.ok) resolve(j.result); else reject(new Error(j && j.error || 'サーバーエラー')); })

  function renderDetail() {
    var el = $('detail');
    var id = S.selected || (S.pathFrom && S.pathTo ? S.pathFrom : '');
    if (!id || !S.byName[id]) { el.classList.remove('open'); el.innerHTML = ''; return; }
    var n = S.byName[id], year = S.data.year || new Date().getFullYear();
    var jc = n.joinYear ? (year - n.joinYear + 1) + '年目（' + n.joinYear + '年入会）' : '';
    var pill = function (name) { var m = S.byName[name]; if (!m) return '<span class="pill ghost">' + esc(surname(name)) + '</span>'; return '<button class="pill' + (m.ghost ? ' ghost' : '') + '" data-go="' + esc(name) + '">' + (m.ghost ? '' : '<span class="sw" style="background:' + color(m) + '"></span>') + esc(m.ghost ? surname(name) : name) + (m.committee && !m.ghost ? '<small>' + esc(m.committee) + '</small>' : '') + '</button>'; };
    // 紹介の上流（自分 ← 紹介者 ← その紹介者 …）
    var chain = [], cur = n, guard = 0; while (cur && cur.introducer && guard++ < 8) { chain.push(cur.introducer); cur = S.byName[cur.introducer]; if (cur && chain.indexOf(cur.introducer) >= 0) break; }
    var sameHobby = S.nodes.filter(function (m) { return !m.ghost && m.id !== n.id && m.hobbies.some(function (h) { return n.hobbies.indexOf(h) >= 0; }); });
    var sameInd = n.industry ? S.nodes.filter(function (m) { return !m.ghost && m.id !== n.id && m.industry === n.industry; }) : [];
    var h = '<div class="d-head"><div class="eyebrow">' + (n.ghost ? '名簿外（OB・紹介者）' : '<span class="sw" style="background:' + color(n) + '"></span>' + esc(n.committee) + (n.role ? '　' + esc(n.role) : '')) + '</div><h3>' + esc(n.name) + '</h3><button class="close" id="d-close" aria-label="閉じる">×</button></div><div class="d-body">';
    if (!n.ghost) {
      h += '<dl class="kv">' + (n.industry ? '<dt>業種</dt><dd>' + esc(n.industry) + '</dd>' : '') + (n.hobbies.length ? '<dt>趣味</dt><dd>' + esc(n.hobbies.join('・')) + '</dd>' : '') + (jc ? '<dt>JC歴</dt><dd>' + esc(jc) + '</dd>' : '') + (n.birthYear ? '<dt>生まれ</dt><dd>' + n.birthYear + '年</dd>' : '') + '</dl>';
      if (!n.industry && !n.hobbies.length && !n.joinYear) h += '<div class="d-sec"><span class="empty">属性はまだ入力されていません（役員がDBの「属性」シートに入れると出ます）</span></div>';
    }
    h += '<div class="d-sec"><h4>紹介の流れ</h4>' + (chain.length ? '<div class="chain">' + esc(n.name) + chain.map(function (c) { return '<span class="arrow">←</span><button data-go="' + esc(c) + '">' + esc(S.byName[c] && S.byName[c].ghost ? surname(c) : c) + '</button>'; }).join('') + '</div>' : '<span class="empty">紹介者は未入力</span>') + '</div>';
    h += '<div class="d-sec"><h4>紹介した人 <span class="num">' + n.intro.length + '</span></h4>' + (n.intro.length ? '<div class="people">' + n.intro.map(pill).join('') + '</div>' : '<span class="empty">なし</span>') + '</div>';
    if (n.closed.length) h += '<div class="d-sec"><h4>クロージングした人 <span class="num">' + n.closed.length + '</span></h4><div class="people">' + n.closed.map(pill).join('') + '</div></div>';
    if (n.closer) h += '<div class="d-sec"><h4>クロージング担当</h4><div class="people">' + pill(n.closer) + '</div></div>';
    if (!n.ghost) {
      h += '<div class="d-sec"><h4>同じ趣味</h4>' + (sameHobby.length ? '<div class="people">' + sameHobby.map(function (m) { return pill(m.id); }).join('') + '</div>' : '<span class="empty">' + (n.hobbies.length ? 'まだいません' : '趣味が未入力') + '</span>') + '</div>';
      h += '<div class="d-sec"><h4>同じ業種' + (n.industry ? '（' + esc(n.industry) + '）' : '') + '</h4>' + (sameInd.length ? '<div class="people">' + sameInd.map(function (m) { return pill(m.id); }).join('') + '</div>' : '<span class="empty">' + (n.industry ? 'いません' : '業種が未入力') + '</span>') + '</div>';
    }
    h += '<div class="actions"><button class="btn" id="d-local">この人のまわりを見る</button><button class="btn" id="d-path">' + (S.pathFrom === n.id && !S.pathTo ? '経路の相手を選んでいます…' : 'この人までの経路') + '</button></div>';
    if (S.pathFrom === n.id && !S.pathTo) h += '<div class="path-hint">グラフ上でもう一人をクリックすると、いちばん短いつながりを表示します</div>';
    if (S.pathFrom === n.id && S.pathTo) h += '<div class="path-hint">' + esc(surname(n.id)) + 'さん → ' + esc(surname(S.pathTo)) + 'さん：' + S.pathHops + 'ステップ　<button id="d-path-clear" style="color:var(--accent);font-weight:600">解除</button></div>';
    h += '</div>';
    el.innerHTML = h; el.classList.add('open');
    $('d-close').onclick = function () { select(''); };
    $('d-local').onclick = function () { setFocus(n.id); S.selected = n.id; render(); setTimeout(fit, 500); };
    $('d-path').onclick = function () { S.pathFrom = n.id; S.pathTo = ''; S.pathNodes = {}; S.pathLinks = {}; applyHighlight(); renderDetail(); toast('グラフ上で相手をクリック'); };
    var pc = $('d-path-clear'); if (pc) pc.onclick = function () { select(n.id); };
    el.querySelectorAll('[data-go]').forEach(function (b) { b.onclick = function () { var to = b.getAttribute('data-go'); if (!S.byName[to]) return; select(to); if (S.mode === 'local') { S.focus = to; render(); } focusNode(to); }; });
  }

  // ── 検索
  var sugIdx = -1;
  $('q').addEventListener('input', function () { var q = this.value.trim().replace(/[\s　]+/g, ' '); var box = $('sugg'); sugIdx = -1; if (!q) { box.style.display = 'none'; return; } var hits = S.nodes.filter(function (n) { return n.name.replace(/ /g, '').indexOf(q.replace(/ /g, '')) >= 0; }).slice(0, 12); box.innerHTML = hits.map(function (n) { return '<div data-id="' + esc(n.id) + '"><span>' + esc(n.ghost ? surname(n.name) : n.name) + '</span><small>' + esc(n.ghost ? '名簿外' : n.committee) + '</small></div>'; }).join('') || '<div><small>見つかりません</small></div>'; box.style.display = 'block'; box.querySelectorAll('[data-id]').forEach(function (d) { d.onclick = function () { go(d.getAttribute('data-id')); }; }); });
  $('q').addEventListener('keydown', function (e) { var items = $('sugg').querySelectorAll('[data-id]'); if (e.key === 'ArrowDown') { sugIdx = Math.min(items.length - 1, sugIdx + 1); } else if (e.key === 'ArrowUp') { sugIdx = Math.max(0, sugIdx - 1); } else if (e.key === 'Enter') { if (items[Math.max(0, sugIdx)]) go(items[Math.max(0, sugIdx)].getAttribute('data-id')); return; } else if (e.key === 'Escape') { $('sugg').style.display = 'none'; return; } else return; items.forEach(function (d, i) { d.classList.toggle('on', i === sugIdx); }); e.preventDefault(); });
  document.addEventListener('click', function (e) { if (!$('search').contains(e.target)) $('sugg').style.display = 'none'; });
  function go(id) { $('sugg').style.display = 'none'; $('q').value = ''; if (S.mode === 'local') { S.focus = id; } select(id); if (S.mode === 'local') render(); if (!visible().nodes.some(function (n) { return n.id === id; })) { S.hiddenCats = {}; render(); } setTimeout(function () { focusNode(id); }, 300); }

  // ── パネル操作
  $('colorby').querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { S.colorBy = b.getAttribute('data-v'); S.hiddenCats = {}; $('colorby').querySelectorAll('.chip').forEach(function (x) { x.classList.toggle('on', x === b); }); render(); }; });
  $('edges').querySelectorAll('.chip').forEach(function (b) { b.onclick = function () { var v = b.getAttribute('data-v'); S.edgeOn[v] = !S.edgeOn[v]; b.classList.toggle('on', S.edgeOn[v]); render(); }; });
  $('show-ob').onchange = function () { S.showOB = this.checked; render(); };
  $('hide-orphan').onchange = function () { S.hideOrphan = this.checked; render(); };
  $('labels-all').onchange = function () { S.labelsAll = this.checked; labelFade(); };
  ['repel', 'dist', 'center'].forEach(function (k) { $('f-' + k).oninput = function () { S.f[k] = +this.value; $('f-' + k + '-v').textContent = this.value; sim.force('charge', d3.forceManyBody().strength(-S.f.repel)).force('center', d3.forceCenter(W / 2, H / 2).strength(S.f.center / 100)); var lf = sim.force('link'); if (lf) lf.distance(function (l) { return S.f.dist + (l.type === 'committee' || l.type === 'industry' ? 30 : 0); }); sim.alpha(.5).restart(); }; });
  $('menu-btn').onclick = function () { $('panel').classList.toggle('hidden'); };
  if (window.matchMedia('(max-width: 760px)').matches) $('panel').classList.add('hidden');
  function fit() {
    var v = visible().nodes; if (!v.length) return;
    var xs = v.map(function (n) { return n.x; }), ys = v.map(function (n) { return n.y; });
    var x0 = Math.min.apply(null, xs) - 40, x1 = Math.max.apply(null, xs) + 40, y0 = Math.min.apply(null, ys) - 40, y1 = Math.max.apply(null, ys) + 50;
    var k = Math.min(3, .92 / Math.max((x1 - x0) / W, (y1 - y0) / H)), t = d3.zoomIdentity.translate(W / 2 - k * (x0 + x1) / 2, H / 2 - k * (y0 + y1) / 2).scale(k);
    svg.transition().duration(500).call(zoom.transform, t);
  }
  $('btn-fit').onclick = fit;
  $('fit-sp').onclick = function () { $('panel').classList.add('hidden'); fit(); };

  // ── 入会年でたどる
  function tlSet(i) { S.tl.idx = i; $('tl').value = String(i < 0 ? S.tl.years.length : i); $('tl-year').textContent = i < 0 ? '全員' : S.tl.years[i] + '年'; render(); }
  $('tl').oninput = function () { var i = +this.value; tlStop(); tlSet(i >= S.tl.years.length ? -1 : i); };
  function tlStop() { clearInterval(S.tl.timer); S.tl.timer = null; $('tl-play').classList.remove('on'); $('tl-play').textContent = '再生'; }
  $('tl-play').onclick = function () {
    if (S.tl.timer) { tlStop(); return; }
    if (!S.tl.years.length) { toast('入会年が入っていないので再生できません'); return; }
    var i = S.tl.idx < 0 || S.tl.idx >= S.tl.years.length - 1 ? 0 : S.tl.idx + 1; tlSet(i);
    $('tl-play').classList.add('on'); $('tl-play').textContent = '停止';
    S.tl.timer = setInterval(function () { if (S.tl.idx >= S.tl.years.length - 1) { tlStop(); return; } tlSet(S.tl.idx + 1); }, 1100);
  };

  // ── キーボード
  document.addEventListener('keydown', function (e) { if (e.target.tagName === 'INPUT') return; if (e.key === '/') { e.preventDefault(); $('q').focus(); } if (e.key === 'Escape') { if (S.pathFrom) { select(S.selected); } else select(''); } if (e.key === 'f') fit(); });

  load(true);
})();
</script>
</body>
</html>
